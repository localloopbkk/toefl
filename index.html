<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08101f">
  <meta name="description" content="A focused TOEFL practice audio player for teacher and student practice tests.">
  <title>TOEFL Listening Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="TOEFL Listening Lab home">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <span><strong>TOEFL</strong><small>LISTENING LAB</small></span>
    </a>
    <div class="header-stats" aria-label="Library summary">
      <span><strong id="trackCount">0</strong> tracks</span>
      <span><strong>7</strong> practice tests</span>
    </div>
  </header>

  <main class="app-shell">
    <aside class="library-panel" aria-label="Playlist filters">
      <div class="panel-heading">
        <p class="eyebrow">Your audio library</p>
        <h1>Practice with focus.</h1>
      </div>

      <label class="search-box">
        <span class="sr-only">Search tracks</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="searchInput" type="search" placeholder="Search track or task…" autocomplete="off">
        <kbd>/</kbd>
      </label>

      <div class="filter-group">
        <p class="filter-label">Library</p>
        <button class="filter-item active" data-audience="All"><span>All audio</span><b id="allCount">0</b></button>
        <button class="filter-item" data-audience="Student"><span>Student tests</span><b id="studentCount">0</b></button>
        <button class="filter-item" data-audience="Teacher"><span>Teacher tests</span><b id="teacherCount">0</b></button>
        <button class="filter-item" data-audience="Favorites"><span>Favorites</span><b id="favoriteCount">0</b></button>
      </div>

      <div class="filter-group">
        <p class="filter-label">Section</p>
        <button class="filter-item active" data-section="All"><span>All sections</span></button>
        <button class="filter-item" data-section="Listening"><span>Listening</span></button>
        <button class="filter-item" data-section="Speaking"><span>Speaking</span></button>
      </div>

      <div class="keyboard-note">
        <span>Space</span> play / pause &nbsp; <span>← →</span> skip 10 sec
      </div>
    </aside>

    <section class="content-panel">
      <div class="content-header">
        <div>
          <p class="eyebrow" id="collectionLabel">Complete collection</p>
          <h2 id="collectionTitle">All practice audio</h2>
        </div>
        <div class="content-actions">
          <label class="select-label">Test
            <select id="testSelect" aria-label="Choose practice test"><option value="All">All tests</option></select>
          </label>
          <label class="select-label">Speed
            <select id="speedSelect" aria-label="Playback speed">
              <option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
            </select>
          </label>
        </div>
      </div>

      <div class="now-card" aria-live="polite">
        <div class="visualizer" id="visualizer" aria-hidden="true"></div>
        <div class="now-copy">
          <p id="nowMeta">Choose a track to begin</p>
          <h3 id="nowTitle">TOEFL Listening Lab</h3>
        </div>
        <button class="icon-button favorite-button" id="nowFavorite" aria-label="Favorite current track" title="Favorite" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 20.5S4 16 4 9.8A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 8 2.8c0 6.2-8 10.7-8 10.7Z"/></svg>
        </button>
      </div>

      <div class="progress-wrap">
        <span id="currentTime">0:00</span>
        <input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Audio progress">
        <span id="duration">0:00</span>
      </div>

      <div class="transport" aria-label="Playback controls">
        <button class="icon-button" id="previousButton" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6V6Z"/></svg></button>
        <button class="skip-button" id="backButton" aria-label="Go back 10 seconds"><svg viewBox="0 0 24 24"><path d="M5 8V4m0 0H1m4 0-3 3a9 9 0 1 0 3-3M9.5 10v5m-1.5 0h3m3-5v5m-1.5-5h3v5"/></svg></button>
        <button class="play-button" id="playButton" aria-label="Play"><svg class="play-icon" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6V6Z"/></svg><svg class="pause-icon" viewBox="0 0 24 24"><path d="M8 6v12M16 6v12"/></svg></button>
        <button class="skip-button" id="forwardButton" aria-label="Go forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M19 8V4m0 0h4m-4 0 3 3a9 9 0 1 1-3-3M9.5 10v5M8 10h3v5m3-5v5m-1.5-5h3v5"/></svg></button>
        <button class="icon-button" id="nextButton" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6V6Z"/></svg></button>
      </div>

      <div class="playlist-heading">
        <span id="resultCount">0 tracks</span>
        <label class="toggle-label"><input type="checkbox" id="autoplayToggle" checked><span></span> Continue automatically</label>
      </div>
      <div id="playlist" class="playlist" role="list"></div>
      <div id="emptyState" class="empty-state" hidden><strong>No audio found</strong><span>Try a different search or filter.</span></div>
    </section>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <script src="tracks.js"></script>
  <script src="app.js"></script>
</body>
</html>
